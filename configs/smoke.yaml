# Overlay for scripts/smoke_test.py: tiny synthetic data, fast settings, isolated outputs.

paths:
  train_csv: data/raw/smoke/train.csv
  test_csv: data/raw/smoke/test.csv
  sample_sub: data/raw/smoke/sample_test_out.csv
  images_dir: data/images/smoke
  cache_dir: data/cache/smoke
  preds_dir: data/cache/smoke/preds
  submissions_dir: submissions/smoke
  experiments_csv: experiments_smoke.csv

cv:
  n_folds: 3
  n_bins: 5

text_features:
  word_max_features: 2000
  char_max_features: 2000
  svd_components: 16

images:
  workers: 8
  timeout: 5
  retries: 1

embed:
  num_workers: 0

gbm:
  early_stopping_rounds: 50
  lightgbm:
    n_estimators: 300
    num_leaves: 15
  catboost:
    iterations: 300

fusion:
  hidden: [128]
  batch_size: 64
  epochs: 15
  patience: 3
  seeds: [0, 1]
