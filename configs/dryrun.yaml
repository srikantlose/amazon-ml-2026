# Overlay for the pre-hackathon dry run on the 2025 price data.
# Created by: python -m src.prepare_dryrun --src data/raw/2025/train.csv
# Keeps every artifact separate from the real run so nothing leaks into Day 1.

paths:
  train_csv: data/raw/dryrun/train.csv
  test_csv: data/raw/dryrun/test.csv
  sample_sub: data/raw/dryrun/sample_test_out.csv
  images_dir: data/images/dryrun
  cache_dir: data/cache/dryrun
  preds_dir: data/cache/dryrun/preds
  submissions_dir: submissions/dryrun
  experiments_csv: experiments_dryrun.csv

text_features:
  word_max_features: 20000
  char_max_features: 20000
  svd_components: 32

gbm:
  lightgbm:
    n_estimators: 2000

fusion:
  epochs: 20
  seeds: [0, 1]
